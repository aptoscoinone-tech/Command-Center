# Managed Server Fleet Configuration (Forced-Command OpenSSH)
servers:
  apricot:
    host: "10.0.1.12"
    port: 22
    user: "cc-executor"
    role: "primary-app"
    disk_mount: "/dev/sda1"
    critical_services: ["nginx", "postgresql", "redis-server", "app-worker"]
    profile: "production"

  mimic:
    host: "10.0.1.20"
    port: 22
    user: "cc-executor"
    role: "staging-mirror"
    disk_mount: "/dev/vda1"
    critical_services: ["nginx", "postgresql", "redis-server"]
    profile: "staging"
